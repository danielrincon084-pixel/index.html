<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA</title>
</head>
<body style="background:#000;color:#fff;padding:15px;font-family:sans-serif">
<h1 style="color:#FFD700;text-align:center">DA</h1>

<div id="lista"></div>

<input id="nuevo" placeholder="Escribe misión..." style="width:70%;padding:10px;background:#222;color:#fff;border:none">
<button onclick="add()" style="width:25%;padding:10px;background:#FFD700;border:none">Agregar</button>

<h3 style="color:#FFD700">Notas</h3>
<div id="notas"></div>
<input id="nota" placeholder="Escribe nota..." style="width:70%;padding:10px;background:#222;color:#fff;border:none">
<button onclick="addNota()" style="width:25%;padding:10px;background:#FFD700;border:none">Enviar</button>

<script>
let habitos = JSON.parse(localStorage.getItem('h')||'[]');
let notas = JSON.parse(localStorage.getItem('n')||'{}');
let hoy = new Date().toISOString().split('T')[0];

function save(){
  localStorage.setItem('h', JSON.stringify(habitos));
  localStorage.setItem('n', JSON.stringify(notas));
}

function show(){
  let html = '';
  habitos.forEach((h,i)=>{
    html += '<div style="background:#111;margin:10px 0;padding:10px;border-radius:8px">'+h+' <button onclick="del('+i+')">X</button></div>';
  });
  document.getElementById('lista').innerHTML = html;

  let nhtml = '';
  if(notas[hoy]){
    notas[hoy].forEach(n=>{
      nhtml += '<div style="background:#222;margin:5px 0;padding:8px;border-radius:5px">'+n+'</div>';
    });
  }
  document.getElementById('notas').innerHTML = nhtml;
}

function add(){
  let val = document.getElementById('nuevo').value;
  if(val){
    habitos.push(val);
    document.getElementById('nuevo').value = '';
    save();
    show();
  }
}

function del(i){
  habitos.splice(i,1);
  save();
  show();
}

function addNota(){
  let val = document.getElementById('nota').value;
  if(val){
    if(!notas[hoy]) notas[hoy] = [];
    notas[hoy].push(val);
    document.getElementById('nota').value = '';
    save();
    show();
  }
}

show();
</script>
</body>
</html>
