<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000">
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:15px}
h1{text-align:center;color:#FFD700;font-size:20px}
.stats{display:flex;justify-content:space-around;background:#111;padding:12px;border-radius:10px;margin-bottom:10px;text-align:center}
.barra{height:8px;background:#333;border-radius:10px;margin:10px 0}
.progreso{height:100%;background:#FFD700;width:0%}
.circulo{width:70px;height:70px;border-radius:50%;background:conic-gradient(#FFD700 0deg, #333 0deg);display:flex;align-items:center;justify-content:center;font-weight:bold;margin:10px auto}
.habito{display:flex;align-items:center;background:#111;padding:12px;margin:10px 0;border-radius:10px;justify-content:space-between}
.izq{display:flex;align-items:center;flex:1;cursor:pointer}
.check{width:24px;height:24px;border:2px solid #555;border-radius:6px;margin-right:12px}
.check.hecho{background:#FFD700;border-color:#FFD700}
.del{background:#ff3333;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:18px}
.add{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin:10px 0}
.notas{background:#111;border:1px solid #333;border-radius:10px;padding:10px;width:100%;min-height:100px;color:#fff;font-size:15px;margin-top:15px}
.titulo{color:#FFD700;margin-top:20px;font-weight:bold}
.comparacion{text-align:center;font-size:14px;margin-top:5px}
.mejor{color:#4CAF50}
.peor{color:#ff3333}
.igual{color:#aaa}
</style>
</head>
<body>
<h1>DA - Misión Diaria</h1>
<div class="circulo" id="circulo">0%</div>
<div class="comparacion" id="comparacion"></div>

<div class="stats">
  <div>🔥 Hoy<br><span id="hoy">0/8</span></div>
  <div>📅 Ayer<br><span id="ayer">0/8</span></div>
</div>
<div class="barra"><div class="progreso" id="barra"></div></div>
<div id="habitos"></div>
<button class="add" onclick="agregar()">+ Agregar Hábito</button>

<div class="titulo">📝 Notas del día</div>
<textarea class="notas" id="notas" placeholder="Escribe aquí tus pensamientos, logros..."></textarea>

<script>
let h=JSON.parse(localStorage.h||'["💪 Gym","📖 Leer 20min","💧 2L Agua","🧘 Meditar","📝 Estudiar","🚫 Redes","😴 Dormir 8h","🍎 Comer bien"]');
let d=JSON.parse(localStorage.d||'{}');
let n=JSON.parse(localStorage.n||'{}');
let dia=new Date().toISOString().split('T')[0];
let ayer=new Date(Date.now()-86400000).toISOString().split('T')[0];

document.getElementById('notas').value=n[dia]||'';
document.getElementById('notas').oninput=e=>{n[dia]=e.target.value;guardar()};

function guardar(){localStorage.h=JSON.stringify(h);localStorage.d=JSON.stringify(d);localStorage.n=JSON.stringify(n)}
function contar(fecha){
  let c=0;h.forEach((_,i)=>{if(d[fecha]&&d[fecha][i])c++});
  return c
}
function r(){
  let hoyCount=contar(dia);
  let ayerCount=contar(ayer);
  let pct=Math.round(hoyCount/h.length*100);
  
  document.getElementById('hoy').innerText=hoyCount+'/'+h.length;
  document.getElementById('ayer').innerText=ayerCount+'/'+h.length;
  document.getElementById('barra').style.width=pct+'%';
  document.getElementById('circulo').style.background=`conic-gradient(#FFD700 ${pct*3.6}deg, #333 ${pct*3.6}deg)`;
  document.getElementById('circulo').innerText=pct+'%';
  
  let dif=hoyCount-ayerCount;
  let texto='';
  if(dif>0)texto=`<span class="mejor">↑ Mejoraste +${dif} vs ayer</span>`;
  if(dif<0)texto=`<span class="peor">↓ Bajaste ${dif} vs ayer</span>`;
  if(dif==0)texto=`<span class="igual">= Igual que ayer</span>`;
  document.getElementById('comparacion').innerHTML=texto;
}
function R(){
  let cont=document.getElementById('habitos');cont.innerHTML='';
  h.forEach((x,i)=>{
    cont.innerHTML+=`<div class="habito">
      <div class="izq" onclick="t(${i})">
        <div class="check ${d[dia]&&d[dia][i]?'hecho':''}"></div>${x}
      </div>
      <button class="del" onclick="borrar(${i})">🗑️</button>
    </div>`
  })
}
function t(i){d[dia]=d[dia]||[];d[dia][i]=!d[dia][i];guardar();r();R()}
function agregar(){let x=prompt("Nuevo hábito:");if(x){h.push(x);guardar();r();R()}}
function borrar(i){if(confirm("¿Eliminar '"+h[i]+"'?")){h.splice(i,1);guardar();r();R()}}

r();R();
</script>
</body>
</html>
