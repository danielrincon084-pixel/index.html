<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA</title>
</head>
<body style="background:#000;color:#fff;padding:15px;font-family:sans-serif;padding-bottom:100px">
<h1 style="color:#FFD700;text-align:center">DA</h1>

<div id="lista"></div>

<div style="position:fixed;bottom:0;left:0;width:100%;background:#000;padding:10px;display:flex;gap:5px">
<input id="nuevo" placeholder="Escribe misión..." style="flex:1;padding:12px;background:#222;color:#fff;border:none;border-radius:8px">
<button onclick="add()" style="padding:12px 20px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold">Agregar</button>
</div>

<h3 style="color:#FFD700">Notas</h3>
<div id="notas"></div>
<div style="display:flex;gap:5px;margin-bottom:20px">
<input id="nota" placeholder="Escribe nota..." style="flex:1;padding:10px;background:#222;color:#fff;border:none;border-radius:8px">
<button onclick="addNota()" style="padding:10px;background:#FFD700;color:#000;border:none;border-radius:8px">Enviar</button>
</div>

<script>
let habitos = JSON.parse(localStorage.getItem('h')||'[]');
let notas = JSON.parse(localStorage.getItem('n')||'{}');
let hoy = new Date().toISOString().split('T')[0];

function save(){
  localStorage.setItem('h', JSON.stringify(habitos));
  localStorage.setItem('n', JSON.stringify(notas));
}

function show(){
  let html = '';
  habitos.forEach((h,i)=>{
    html += '<div style="background:#111;margin:10px 0;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center">'+h+' <button onclick="del('+i+')" style="background:#ff3333;color:#fff;border:none;border-radius:5px;padding:5px 10px">X</button></div>';
  });
  document.getElementById('lista').innerHTML = html;

  let nhtml = '';
  if(notas[hoy]){
    notas[hoy].forEach(n=>{
      nhtml += '<div style="background:#222;margin:5px 0;padding:8px;border-radius:5px">'+n+'</div>';
    });
  }
  document.getElementById('notas').innerHTML = nhtml;
}

function add(){
  let val = document.getElementById('nuevo').value.trim();
  if(val){
    habitos.push(val);
    document.getElementById('nuevo').value = '';
    save();
    show();
  }
}

function del(i){
  habitos.splice(i,1);
  save();
  show();
}

function addNota(){
  let val = document.getElementById('nota').value.trim();
  if(val){
    if(!notas[hoy]) notas[hoy] = [];
    notas[hoy].push(val);
    document.getElementById('nota').value = '';
    save();
    show();
  }
}

document.getElementById('nuevo').addEventListener('keypress',e=>{if(e.key==='Enter')add()});
show();
</script>
</body>
</html>
