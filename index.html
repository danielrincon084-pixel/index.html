<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:15px}
h1{text-align:center;color:#FFD700;font-size:20px}
.stats{display:flex;justify-content:space-around;background:#111;padding:12px;border-radius:10px;margin-bottom:10px;text-align:center}
.barra{height:8px;background:#333;border-radius:10px;margin:10px 0}
.progreso{height:100%;background:#FFD700;width:0%}
.circulo{width:70px;height:70px;border-radius:50%;background:conic-gradient(#FFD700 0deg, #333 0deg);display:flex;align-items:center;justify-content:center;font-weight:bold;margin:10px auto}
.habito{display:flex;align-items:center;background:#111;padding:12px;margin:10px 0;border-radius:10px;justify-content:space-between}
.izq{display:flex;align-items:center;flex:1;cursor:pointer}
.check{width:24px;height:24px;border:2px solid #555;border-radius:6px;margin-right:12px}
.check.hecho{background:#FFD700;border-color:#FFD700}
.del{background:#ff3333;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:18px}
.add{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin:10px 0}
.notas-box{background:#111;border:1px solid #333;border-radius:10px;padding:10px;margin-top:15px}
.nota-item{background:#222;padding:8px;border-radius:8px;margin:8px 0;font-size:14px}
.nota-fecha{font-size:11px;color:#aaa}
.input-nota{display:flex;gap:8px;margin-top:10px}
.input-nota input{flex:1;background:#222;border:1px solid #333;border-radius:8px;padding:10px;color:#fff}
.input-nota button{background:#FFD700;color:#000;border:none;border-radius:8px;padding:10px 15px;font-weight:bold}
.titulo{color:#FFD700;margin-top:20px;font-weight:bold}
.comparacion{text-align:center;font-size:14px;margin-top:5px}
.mejor{color:#4CAF50}.peor{color:#ff3333}.igual{color:#aaa}
</style>
</head>
