<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DA</title>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;margin:0;padding:15px">
<h1 style="text-align:center;color:#FFD700">DA - Misión Diaria</h1>
<div id="circulo" style="width:80px;height:80px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:bold;margin:10px auto">0%</div>
<div id="comp" style="text-align:center;font-size:14px"></div>
<div style="display:flex;justify-content:space-around;background:#111;padding:12px;border-radius:10px;margin:10px 0">
  <div>Hoy: <span id="hoy">0</span></div>
  <div>Ayer: <span id="ayer">0</span></div>
</div>
<div id="habitos"></div>

<div style="display:flex;gap:8px;margin:10px 0">
  <input type="text" id="nuevoHabito" placeholder="Nueva misión..." style="flex:1;background:#222;border:none;border-radius:8px;padding:12px;color:#fff">
  <button onclick="agregar()" style="background:#FFD700;color:#000;border:none;border-radius:8px;padding:12px;font-weight:bold">+ Agregar</button>
</div>

<h3 style="color:#FFD700">📝 Notas</h3>
<div id="listaNotas"></div>
<div style="display:flex;gap:8px">
  <input type="text" id="inputNota" placeholder="Escribe nota..." style="flex:1;background:#222;border:none;border-radius:8px;padding:10px;color:#fff">
  <button onclick="enviarNota()" style="background:#FFD700;color:#000;border:none;border-radius:8px;padding:10px">Enviar</button>
</div>

<script>
let h = ["💪 Gym","📖 Leer","💧 Agua","🧘 Meditar"];
let d = {};
let n = {};
let dia = new Date().toISOString().split('T')[0];
let ayer = new Date(Date.now()-86400000).toISOString().split('T')[0];

if(localStorage.h) h = JSON.parse(localStorage.h);
if(localStorage.d) d = JSON.parse(localStorage.d);
if(localStorage.n) n = JSON.parse(localStorage.n);
localStorage.ultimoDia = dia;

function guardar(){
  localStorage.h = JSON.stringify(h);
  localStorage.d = JSON.stringify(d);
  localStorage.n = JSON.stringify(n);
}

function contar(fecha){
  let c = 0;
  if(!d[fecha]) return 0;
  for(let i=0; i<h.length; i++){
    if(d[fecha][i]) c++;
  }
  return c;
}

function actualizar(){
  let hc = contar(dia);
  let ac = contar(ayer);
  let p = h.length > 0? Math.round(hc/h.length*100) : 0;
  document.getElementById('hoy').innerText = hc;
  document.getElementById('ayer').innerText = ac;
  document.getElementById('circulo').innerText = p+'%';
  document.getElementById('circulo').style.background = `conic-gradient(#FFD700 ${p*3.6}deg, #333 ${p*3.6}deg)`;
  let dif = hc-ac;
  if(dif>0) document.getElementById('comp').innerHTML = '<span style="color:#4CAF50">↑ +' + dif + ' vs ayer</span>';
  else if(dif<0) document.getElementById('comp').innerHTML = '<span style
